[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Satelite_proj"
version = "0.1.0"
description = "Satelite Prediction"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "torch>=2.1",
    "torchvision>=0.16",
    "scikit-learn>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "requests"
]
[project.optional-dependencies]
dev = [
    "ipykernel",
    "jupyterlab",
    "black",
    "ruff",
    "mypy",
]

